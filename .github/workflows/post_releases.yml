name: Publish Package to PyPI

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  discover-tags:
    name: Discover Git Tags
    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.collect.outputs.tags }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect tags
        id: collect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAGS=$(git tag --list 'v*' --sort=version:refname |
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            TAGS=$(jq -nc --arg tag "$REF_NAME" '[$tag]')
          fi

          if [[ "$TAGS" == "[]" ]]; then
            echo "No matching tags found."
            exit 1
          fi

          echo "Found tags: $TAGS"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.tag }}
    needs: discover-tags

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.discover-tags.outputs.tags) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade build packaging tomlkit

      - name: Set post-release version
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_TAG: ${{ matrix.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import tomlkit
          from packaging.version import Version

          tag = os.environ["SOURCE_TAG"]
          version = Version(tag.removeprefix("v"))
          new_version = f"{version}.post1"

          path = Path("pyproject.toml")
          document = tomlkit.parse(path.read_text(encoding="utf-8"))

          document["project"]["version"] = new_version

          path.write_text(
              tomlkit.dumps(document),
              encoding="utf-8",
          )

          print(f"Prepared version: {new_version}")
          PY

      - name: Build package
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.tag }}
          path: dist/

  publish:
    name: Publish ${{ matrix.tag }} to PyPI

    needs:
      - discover-tags
      - build

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.discover-tags.outputs.tags) }}

    environment:
      name: pypi
      url: https://pypi.org/p/disvortilo

    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v6
        with:
          name: dist-${{ matrix.tag }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1